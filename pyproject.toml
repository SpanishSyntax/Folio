[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "folio"
version = "0.1.0"
description = "Markdown to Typst PDF Document Compiler"
readme = "README.md"
authors = [{ name = "SpanishSyntax", email = "spanishsyntax@pyritelabs.cc" }]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["markdown", "typst", "pdf", "pandoc", "compiler", "typesetting"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Documentation",
  "Topic :: Text Processing :: Markup",
]
dependencies = []

[project.scripts]
folio = "folio.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["folio*"]

[tool.setuptools.package-data]
folio = [
  "templates/*",
  "templates/**/*",
]
